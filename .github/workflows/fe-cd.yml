name: Deploy Frontend to App Engine

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      VITE_APP_API_URL: ${{ vars.VITE_APP_API_URL }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_IDP_ACCT_CONSOLE: ${{ vars.VITE_IDP_ACCT_CONSOLE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate production configuration
        run: |
          node --input-type=module <<'NODE'
          for (const name of ["GCP_PROJECT_ID", "VITE_APP_API_URL", "VITE_GOOGLE_MAPS_MAP_ID", "VITE_GOOGLE_MAPS_API_KEY"]) {
            if (!process.env[name]?.trim()) throw new Error(`Missing required setting: ${name}`);
          }
          const api = new URL(process.env.VITE_APP_API_URL);
          if (api.protocol !== "https:" || !/\/api\/?$/.test(api.pathname) || api.search || api.hash || api.username || api.password) {
            throw new Error("VITE_APP_API_URL must be an HTTPS backend URL ending in /api");
          }
          if (process.env.VITE_IDP_ACCT_CONSOLE) {
            const account = new URL(process.env.VITE_IDP_ACCT_CONSOLE);
            if (account.protocol !== "https:" || account.username || account.password) {
              throw new Error("VITE_IDP_ACCT_CONSOLE must be an HTTPS account-console URL");
            }
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run all unit and component integration tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Prepare static deployment
        run: |
          test -s build/client/index.html
          cp app.yaml build/client/app.yaml

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Frontend
        id: deploy
        uses: google-github-actions/deploy-appengine@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          deliverables: build/client/app.yaml
          version: frontend-${{ github.run_id }}-${{ github.run_attempt }}
          promote: false

      - name: Report Deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          printf 'Frontend deployment URL: %s\nTraffic was not promoted.\nAllow this origin in backend CORS, authentication redirects, and Maps key referrers before testing.\n' "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"